<!doctype html>
<html lang="zh"><head><meta charset="utf-8"><title>街记冰室 · 画面草图</title>
<style>
@font-face { font-family: FP; src: url(fp.ttf); }
body { margin: 0; background: #2b2230; color: #f3e6cf; font-family: FP, sans-serif; }
.row { display: flex; gap: 24px; padding: 24px; align-items: flex-start; }
.p { display: flex; flex-direction: column; align-items: center; gap: 10px; }
.cap { font-size: 24px; }
canvas { image-rendering: pixelated; display: block; }
</style></head><body><div class="row" id="row"></div>
<script>
'use strict';
// 画面草图：竖屏 180×320 逻辑像素，像素部分画在低清画布再放大 2 倍，文字按放大后的分辨率画。
// 画板（Grid / paint）照抄 _workflow/template，方便以后搬进游戏。
const OUT = '#3a2a2e', S = 2, R = Math.round;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
function mk(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
function shade(hex, a) { const n = parseInt(hex.slice(1), 16), c = v => clamp(v + a, 0, 255); return '#' + ((1 << 24) | (c(n >> 16) << 16) | (c((n >> 8) & 255) << 8) | c(n & 255)).toString(16).slice(1); }
function mixHex(a, b, t) { const p = h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)], A = p(a), B = p(b); return '#' + A.map((v, i) => R(v + (B[i] - v) * t).toString(16).padStart(2, '0')).join(''); }
class Grid {
  constructor(w, h) { this.w = w; this.h = h; this.d = new Array(w * h).fill(null); }
  set(x, y, c) { x |= 0; y |= 0; if (c && x >= 0 && y >= 0 && x < this.w && y < this.h) this.d[y * this.w + x] = c; }
  get(x, y) { return (x < 0 || y < 0 || x >= this.w || y >= this.h) ? null : this.d[y * this.w + x]; }
  ell(cx, cy, rx, ry, c) { for (let y = 0; y < this.h; y++) for (let x = 0; x < this.w; x++) { const dx = (x + .5 - cx) / rx, dy = (y + .5 - cy) / ry; if (dx * dx + dy * dy <= 1) this.set(x, y, typeof c === 'function' ? c(x, y) : c); } }
  rect(x, y, w, h, c) { for (let j = y; j < y + h; j++) for (let i = x; i < x + w; i++) this.set(i, j, typeof c === 'function' ? c(i, j) : c); }
  tri(ax, ay, bx, by, cx, cy, c) {
    const e = (px, py, qx, qy, rx, ry) => (qx - px) * (ry - py) - (qy - py) * (rx - px);
    for (let y = Math.floor(Math.min(ay, by, cy)); y <= Math.ceil(Math.max(ay, by, cy)); y++) for (let x = Math.floor(Math.min(ax, bx, cx)); x <= Math.ceil(Math.max(ax, bx, cx)); x++) {
      const px = x + .5, py = y + .5, w0 = e(bx, by, cx, cy, px, py), w1 = e(cx, cy, ax, ay, px, py), w2 = e(ax, ay, bx, by, px, py);
      if ((w0 >= 0 && w1 >= 0 && w2 >= 0) || (w0 <= 0 && w1 <= 0 && w2 <= 0)) this.set(x, y, c);
    }
  }
  line(x0, y0, x1, y1, c, t = 1) { const n = Math.max(1, Math.ceil(Math.max(Math.abs(x1 - x0), Math.abs(y1 - y0)))); for (let i = 0; i <= n; i++) this.rect(R(x0 + (x1 - x0) * i / n), R(y0 + (y1 - y0) * i / n), t, t, c); }
  outline(col = OUT) { const add = []; for (let y = 0; y < this.h; y++) for (let x = 0; x < this.w; x++) if (!this.get(x, y) && (this.get(x - 1, y) || this.get(x + 1, y) || this.get(x, y - 1) || this.get(x, y + 1))) add.push([x, y]); add.forEach(([x, y]) => this.set(x, y, col)); }
  autoShade() {
    const src = this.d.slice(), at = (x, y) => (x < 0 || y < 0 || x >= this.w || y >= this.h) ? null : src[y * this.w + x];
    for (let y = 0; y < this.h; y++) for (let x = 0; x < this.w; x++) {
      const c = at(x, y); if (!c || c === OUT) continue;
      const u = at(x, y - 1), d = at(x, y + 1), l = at(x - 1, y), r = at(x + 1, y);
      if (u !== c && d !== c && l !== c && r !== c) continue;
      if (!u || (!l && u !== c)) this.d[y * this.w + x] = shade(c, 22); else if (!d || !r) this.d[y * this.w + x] = shade(c, -24);
    }
  }
  selOutline() { const add = []; for (let y = 0; y < this.h; y++) for (let x = 0; x < this.w; x++) { if (this.get(x, y)) continue; const below = this.get(x, y + 1), n = below || this.get(x - 1, y) || this.get(x + 1, y) || this.get(x, y - 1); if (n) add.push([x, y, mixHex(n, OUT, below ? .55 : .75)]); } add.forEach(([x, y, c]) => this.set(x, y, c)); }
  canvas() { const c = mk(this.w, this.h), x = c.getContext('2d'); for (let p = 0; p < this.w * this.h; p++) { const col = this.d[p]; if (col) { x.fillStyle = col; x.fillRect(p % this.w, (p / this.w) | 0, 1, 1); } } return c; }
}
function paint(w, h, fn, outline = true) { const G = new Grid(w, h); fn(G); if (outline === 'plain') G.outline(); else if (outline) { G.autoShade(); G.selOutline(); } return G.canvas(); }
function rows(rs, pal, outline = true) { return paint(rs[0].length + 2, rs.length + 2, G => rs.forEach((r, y) => [...r].forEach((ch, x) => { if (pal[ch]) G.set(x + 1, y + 1, pal[ch]); })), outline && 'plain'); }
const px = (c, x, y, w, h, col) => { c.fillStyle = col; c.fillRect(x, y, w, h); };
const put = (c, img, x, y) => c.drawImage(img, R(x), R(y));
let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;

// ============================================================ 调色板
const P = {
  floorA: '#eadcbc', floorB: '#ddcaa3', floorG: '#5f8f7e', kitchen: '#d2c4a2', kitchenL: '#c4b592',
  wallG: '#9cc4ad', wallGd: '#88b39b', tileW: '#f4efe2', tileL: '#dcd5c4', trim: '#6b4a35', trimL: '#8a6448',
  wood: '#a8754a', woodD: '#7d5436', woodL: '#d4a06e', marble: '#ece7de', marbleV: '#d6cfc2',
  glass: '#cfe9e6', glassD: '#a9d6d2', steel: '#c9cdd0', steelD: '#9aa0a3', dark: '#3b3135',
  red: '#c8463c', cream: '#fff4dc', gold: '#ffd75e', green: '#3f6b5a', greenL: '#5f9a80',
  street: '#c4bdb1', streetL: '#ada699', skin: '#f2c9a0',
};

// ============================================================ 小图（商品、图标）
const TART = rows(['.rrrr.', 'rYYYYr', 'rYyYYr', '.rrrr.'], { r: '#c98a3a', Y: '#f6c94a', y: '#fff0a0' });
const BUN = rows(['.bbbbb.', 'bLbLbLb', 'bbLbLbb', 'bLbbbLb', '.ddddd.'], { L: '#f7d27a', b: '#e2a23e', d: '#b8782e' });
const PUDDING = rows(['.cccc.', 'wccccw', 'wwwwww', '.wwww.'], { c: '#fff6dc', w: '#dfe7ea' });
const CUP = rows(['tttt', 'wwww', 'wwww', '.ww.'], { t: '#b0703a', w: '#f4f1ea' });
const COIN = rows(['.ggg.', 'gyggg', 'ggggg', 'ggggo', '.ooo.'], { g: '#f2c14e', y: '#fff3a0', o: '#c9902e' });
const HAND = rows(['..WW.....', '..WW.....', '..WW.....', '..WWWW...', '..WWWWWW.', 'WWWWWWWWW', 'WWWWWWWWW', '.WWWWWWWW', '..WWWWWW.', '...WWWW..'], { W: '#ffffff' });
const LOCK = rows(['.ggg.', 'g...g', 'g...g', 'yyyyy', 'yy.yy', 'yy.yy', 'yyyyy'], { g: '#c9cdd0', y: '#f2c14e' });
const ICON = {
  shelf: rows(['wwwwwwwww', '.y.y.y.y.', 'wwwwwwwww', '.b.b.b.b.', 'wwwwwwwww', 'w.......w'], { w: '#a8754a', y: '#f6c94a', b: '#e2a23e' }),
  basket: rows(['...hhh...', '..h...h..', 'bbbbbbbbb', 'bkbkbkbkb', '.bbbbbbb.', '..bbbbb..'], { h: '#7d5436', b: '#d4a06e', k: '#a8754a' }),
  staff: rows(['...hhh...', '..hsssh..', '..sssss..', '...sss...', '.aaaaaaa.', 'aawwwwwaa', 'aawwwwwaa'], { h: '#3a2a2a', s: '#f2c9a0', a: '#5d8cc0', w: '#f4efe2' }),
  book: rows(['rrrr.rrrr', 'rppr.rppr', 'rppr.rppr', 'rppr.rppr', 'rrrrrrrrr'], { r: '#c8463c', p: '#fff4dc' }),
  shelfRed: rows(['wwwwwww', '.......', 'wwwwwww', '.b.b.b.', 'wwwwwww'], { w: '#a8754a', b: '#e2a23e' }),
  mute: rows(['...s..', '..ss.w', 'ssss..', 'ssss.w', '..ss..', '...s.w'], { s: '#f3e6cf', w: '#9a8a98' }),
};
const CAT = rows(['o...o..', 'oo.oo..', 'ooooo..', 'oeoeo..', 'ooooo.t', 'owwwo.t', 'ooooooo', 'oo.oo..'], { o: '#e8963c', e: OUT, w: '#fff3e0', t: '#e8963c' });

// 小人 12×20：face 'f' 正面 / 'b' 背面；seat 坐着（不画腿）
function person(o) {
  const sk = o.skin || P.skin, h = o.seat ? 16 : 20;
  return paint(12, h, G => {
    if (!o.seat) { G.rect(3, 14, 2, 4, o.pants || '#4a4a5a'); G.rect(7, 14, 2, 4, o.pants || '#4a4a5a'); }
    G.rect(2, 9, 8, 6, o.shirt); G.rect(1, 10, 1, 4, o.shirt); G.rect(10, 10, 1, 4, o.shirt);
    G.set(1, 14, sk); G.set(10, 14, sk);
    if (o.apron && o.face === 'f') G.rect(3, 10, 6, 5, o.apron);
    if (o.apron && o.face === 'b') { G.rect(2, 12, 8, 1, o.apron); }
    if (o.bag) G.rect(9, 12, 3, 4, o.bag);
    G.ell(6, 5, 4.3, 4.3, sk);
    if (o.face === 'b') G.ell(6, 4.6, 4.5, 4.4, o.hair);
    else { G.rect(2, 1, 8, 3, o.hair); G.set(2, 4, o.hair); G.set(9, 4, o.hair); }
    if (o.style === 'bun') G.ell(6, 1, 2, 1.6, o.hair);
    if (o.style === 'pony' && o.face === 'b') G.rect(5, 8, 2, 3, o.hair);
    if (o.face === 'f') { G.set(4, 5, OUT); G.set(7, 5, OUT); G.set(5, 7, '#d98a7a'); G.set(6, 7, '#d98a7a'); }
  });
}
const PPL = {
  kun: person({ face: 'b', hair: '#e8e6e0', shirt: '#d6c6a0', apron: '#f6f2e8', pants: '#5a5050' }),
  lin: person({ face: 'f', hair: '#4a3040', style: 'bun', shirt: '#d9809a', apron: '#f0e6d0' }),
  wen: person({ face: 'b', hair: '#2e2626', style: 'pony', shirt: '#cfe0ea', apron: '#f0e6d0' }),
  shao: person({ face: 'f', hair: '#3a2a2a', shirt: '#4f7fb8', apron: '#f0e6d0' }),
  q1: person({ face: 'b', hair: '#3a2a2a', shirt: '#5d8cc0' }), q2: person({ face: 'b', hair: '#6b4a35', shirt: '#d7765a' }),
  q3: person({ face: 'b', hair: '#2b2b3b', shirt: '#7fae6a', style: 'pony' }), q4: person({ face: 'b', hair: '#a0522d', shirt: '#e2b84f' }),
  br: person({ face: 'b', hair: '#4a3a3a', shirt: '#9a7cc2', style: 'bun' }), walk: person({ face: 'f', hair: '#2b2b3b', shirt: '#e2b84f', bag: '#f4efe2' }),
  pass: person({ face: 'f', hair: '#6b4a35', shirt: '#7fae6a' }),
  s1: person({ face: 'b', hair: '#3a2a2a', shirt: '#d7765a', seat: true }), s2: person({ face: 'b', hair: '#5a4040', shirt: '#5d8cc0', seat: true, style: 'bun' }),
  f1: person({ face: 'f', hair: '#3a2a2a', shirt: '#9a7cc2', seat: true }), f2: person({ face: 'f', hair: '#6b4a35', shirt: '#7fae6a', seat: true, style: 'pony' }),
  f3: person({ face: 'f', hair: '#a0522d', shirt: '#e2b84f', seat: true }),
};

// ============================================================ 场景零件
function box(c, x, y, w, h, topH, top, front) {   // 3/4 视角的方块：上面 + 正面 + 描边
  px(c, x - 1, y - 1, w + 2, h + 2, OUT);
  px(c, x, y, w, topH, top); px(c, x, y, w, 1, shade(top, 16));
  px(c, x, y + topH, w, h - topH, front); px(c, x, y + topH, w, 1, shade(front, -30)); px(c, x, y + h - 1, w, 1, shade(front, -18));
}
function floor(c, x0, y0, w, h, accent = P.floorG) {
  c.save(); c.beginPath(); c.rect(x0, y0, w, h); c.clip();
  for (let y = y0; y < y0 + h; y += 8) for (let x = x0; x < x0 + w; x += 8) px(c, x, y, 8, 8, (((x - x0) >> 3) + ((y - y0) >> 3)) & 1 ? P.floorB : P.floorA);
  for (let y = y0; y <= y0 + h; y += 16) for (let x = x0; x <= x0 + w; x += 16) { px(c, x - 1, y - 2, 2, 4, accent); px(c, x - 2, y - 1, 4, 2, accent); }
  c.restore();
}
function backWall(c, x0, y0, w) {
  px(c, x0, y0, w, 2, P.trim); px(c, x0, y0 + 2, w, 24, P.wallG);
  for (let x = x0 + 3; x < x0 + w; x += 6) px(c, x, y0 + 2, 1, 24, P.wallGd);
  px(c, x0, y0 + 26, w, 2, P.trim); px(c, x0, y0 + 26, w, 1, P.trimL);
  px(c, x0, y0 + 28, w, 12, P.tileW);
  for (let y = y0 + 31; y < y0 + 40; y += 4) px(c, x0, y, w, 1, P.tileL);
  for (let x = x0 + 2; x < x0 + w; x += 4) px(c, x, y0 + 28, 1, 12, P.tileL);
  px(c, x0, y0 + 40, w, 2, 'rgba(70,45,30,.22)');
}
function menuBoard(c, x, y, w, h) {   // 红底手写菜单牌
  px(c, x - 1, y - 1, w + 2, h + 2, OUT); px(c, x, y, w, h, '#b8342c'); px(c, x, y, w, 1, '#d4554a');
  for (let r = y + 3; r < y + h - 2; r += 3) { let cx = x + 2; while (cx < x + w - 3) { const l = 2 + R(rnd() * 4); if (cx + l > x + w - 2) break; px(c, cx, r, l, 1, '#f3d9a4'); cx += l + 2; } }
}
function clock(c, x, y) { const g = paint(11, 11, G => { G.ell(5.5, 5.5, 5, 5, P.cream); }, true); put(c, g, x - 5, y - 5); px(c, x, y - 3, 1, 3, OUT); px(c, x, y, 2, 1, OUT); }
function stool(c, x, y) { px(c, x + 4, y + 3, 2, 8, P.steel); px(c, x + 2, y + 10, 6, 1, P.steelD); put(c, paint(12, 6, G => G.ell(6, 3, 5.2, 2.6, P.red)), x - 1, y); }
function patience(c, x, y, col) { px(c, x - 1, y - 1, 10, 4, OUT); px(c, x, y, 8, 2, '#4a3a48'); px(c, x, y, col === 'y' ? 4 : 7, 2, col === 'y' ? '#e7c34a' : '#7cc46c'); }
function dash(c, x, y, w, h, col) { for (let i = 0; i < w; i += 3) { px(c, x + i, y, 2, 1, col); px(c, x + i, y + h - 1, 2, 1, col); } for (let j = 0; j < h; j += 3) { px(c, x, y + j, 1, 2, col); px(c, x + w - 1, y + j, 1, 2, col); } }

// 双层货架：x, y = 下层台面左上；宽 48
function shelf(c, x, y, lower, upper) {
  const ux = x + 6, uy = y - 14;
  box(c, x, y, 48, 17, 10, '#d9a773', '#9a6a42');
  px(c, x + 2, y + 17, 4, 3, OUT); px(c, x + 42, y + 17, 4, 3, OUT);
  px(c, ux + 3, y - 5, 2, 7, '#d8b04a'); px(c, ux + 31, y - 5, 2, 7, '#d8b04a');
  box(c, ux, uy, 36, 9, 6, '#e3b583', '#a8754a');
  if (upper) for (let i = 0; i < 5; i++) put(c, upper, ux + 1 + i * 7, uy - 1);
  if (lower) { const st = lower.width > 8 ? 8 : 7, n = lower.width > 8 ? 5 : 6; for (const ry of [y - 1, y + 4]) for (let i = 0; i < n; i++) put(c, lower, x + 1 + i * st, ry); }
}

// ============================================================ 本铺（屏幕坐标：世界占 y 18–262）
function drawShopWorld(c, open) {
  seed = 7;
  floor(c, 4, 58, 172, 150);
  px(c, 4, 58, 172, 28, P.kitchen);
  for (let x = 4; x < 176; x += 8) px(c, x, 58, 1, 28, P.kitchenL);
  for (let y = 66; y < 86; y += 8) px(c, 4, y, 172, 1, P.kitchenL);
  backWall(c, 4, 18, 172);
  menuBoard(c, 8, 21, 32, 13); menuBoard(c, 72, 21, 42, 13); menuBoard(c, 124, 21, 46, 11);
  clock(c, 56, 28);
  // 烤箱
  box(c, 6, 42, 34, 28, 5, '#dcdfe1', '#b8bcbf');
  px(c, 10, 52, 22, 12, P.dark); px(c, 12, 58, 18, 4, '#e98a3c'); px(c, 12, 57, 18, 1, '#f6b45a');
  px(c, 10, 49, 22, 1, P.steelD); px(c, 34, 51, 3, 3, P.dark); px(c, 34, 57, 3, 3, P.dark);
  // 蒸笼
  box(c, 44, 58, 22, 12, 3, '#6a6e72', '#4c5054');
  for (let i = 0; i < 3; i++) { px(c, 45, 43 + i * 5, 20, 5, OUT); px(c, 46, 44 + i * 5, 18, 4, '#d7b07a'); px(c, 46, 46 + i * 5, 18, 1, '#b48a55'); }
  px(c, 47, 40, 16, 4, OUT); px(c, 48, 41, 14, 3, '#e6c48e');
  px(c, 52, 35, 2, 2, '#ffffff'); px(c, 56, 32, 2, 2, '#ffffff'); px(c, 54, 37, 1, 1, '#ffffff');
  // 晾架
  box(c, 72, 50, 40, 20, 3, P.steel, '#b3b8bb');
  for (let i = 0; i < 5; i++) put(c, TART, 74 + i * 7, 47);
  px(c, 74, 59, 36, 1, P.steelD); for (let i = 0; i < 5; i++) put(c, BUN, 73 + i * 7.5, 60);
  // 水吧
  box(c, 118, 54, 56, 16, 4, '#dcdfe1', '#aeb3b6');
  for (const ux of [122, 138]) { px(c, ux - 1, 35, 14, 21, OUT); px(c, ux, 36, 12, 19, P.steel); px(c, ux, 36, 12, 2, '#e8ebed'); px(c, ux, 44, 12, 2, P.dark); px(c, ux + 12, 48, 3, 2, P.steelD); px(c, ux + 2, 37, 1, 17, '#eef1f2'); }
  px(c, 157, 38, 1, 14, P.dark); px(c, 155, 38, 6, 1, P.dark); px(c, 158, 41, 6, 9, OUT); px(c, 159, 42, 4, 7, '#7a4a2a');
  for (let i = 0; i < 3; i++) { px(c, 165, 51 - i * 3, 7, 3, OUT); px(c, 166, 51 - i * 3, 5, 2, '#f4f1ea'); }
  // 柜台后的员工
  put(c, PPL.kun, 49, 62); put(c, PPL.wen, 140, 64); put(c, PPL.lin, 38, 66);
  // 收银台 + 玻璃柜
  box(c, 4, 84, 50, 22, 6, P.marble, '#9a6a42');
  for (let x = 8; x < 54; x += 6) px(c, x, 91, 1, 14, '#875a37');
  box(c, 12, 76, 22, 10, 4, '#e9e0c8', '#d6caa8');
  px(c, 14, 72, 9, 4, OUT); px(c, 15, 73, 7, 2, '#2f5a48'); px(c, 16, 73, 2, 1, '#9fe0b0'); px(c, 19, 73, 2, 1, '#9fe0b0');
  for (let i = 0; i < 4; i++) px(c, 14 + i * 4, 82, 2, 1, '#9b8f73');
  px(c, 55, 71, 89, 36, OUT); px(c, 56, 72, 87, 4, '#e6f5f3'); px(c, 56, 76, 87, 30, P.glass);
  px(c, 56, 89, 87, 1, P.glassD); px(c, 56, 103, 87, 3, P.steelD);
  for (let i = 0; i < 9; i++) put(c, PUDDING, 58 + i * 9, 82);
  for (let i = 0; i < 9; i++) put(c, TART, 58 + i * 9, 95);
  for (let i = 0; i < 4; i++) { px(c, 66 + i * 22, 78, 1, 8, 'rgba(255,255,255,.6)'); px(c, 67 + i * 22, 77, 1, 4, 'rgba(255,255,255,.6)'); }
  box(c, 146, 84, 30, 6, 6, '#e3ddd2', '#e3ddd2'); px(c, 160, 84, 1, 6, P.marbleV);
  // 排队（背面）+ 耐心条
  // 耐心条只在变黄以后才出现，平时不挂
  [[PPL.q1, 106, 'g'], [PPL.q2, 122, 'g'], [PPL.q3, 138, 'y'], [PPL.q4, 154, 'g']].forEach(([s, y, col]) => { put(c, s, 17, y); if (col === 'y') patience(c, 31, y + 2, col); });
  // 货架
  shelf(c, 46, 136, TART, TART);
  shelf(c, 104, 136, BUN, null);
