<!doctype html>
<html lang="zh"><head><meta charset="utf-8"><title>街记冰室 · 字体方案</title>
<style>
@font-face { font-family: FP; src: url(fp.ttf); }
@font-face { font-family: QK; src: url(fq.ttf); }
@font-face { font-family: KL; src: url(fk.ttf); }
@font-face { font-family: CB; src: url(fonts/cubic.ttf); }
@font-face { font-family: MS; src: url(fonts/mashan.ttf); }
@font-face { font-family: WK; src: url(fonts/wenkai.ttf); }
@font-face { font-family: XW; src: url(fonts/xiaowei.ttf); }
@font-face { font-family: SR; src: url(fonts/serif.ttf); font-weight: 900; }
@font-face { font-family: LC; src: url(fonts/longcang.ttf); }
body { margin: 0; background: #2b2230; color: #f3e6cf; font-family: FP, sans-serif; font-size: 12px; -webkit-font-smoothing: none; }
.row { display: flex; flex-wrap: wrap; gap: 16px; padding: 16px; width: 1500px; }
.card { width: 330px; background: #3a2e3c; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
.tag { font: 24px FP; color: #ffd75e; }
.note { color: #cdbfb0; font: 12px FP; line-height: 18px; }
.bar { display: flex; justify-content: space-between; align-items: center; background: #2b2230; padding: 6px 10px; }
.sign { background: #5a3524; color: #e9c46a; text-align: center; padding: 6px; letter-spacing: 12px; }
.menu { background: #a8483c; color: #f6ead0; padding: 8px 12px; line-height: 20px; }
.menu b { font-weight: normal; color: #e9c46a; display: block; text-align: center; }
.menu span { float: right; color: #ffe08a; }
.bubble { align-self: flex-start; background: #fff7e6; color: #3a2a2e; border: 2px solid #e9c46a; padding: 4px 8px; }
.btns { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.btns div { background: #f6e8c8; color: #3a2a2e; text-align: center; padding: 10px 0; border-bottom: 3px solid #c9b48b; }
.talk { background: #f6e8c8; color: #3a2a2e; padding: 8px 10px; line-height: 22px; }
.talk em { font-style: normal; color: #a8483c; }
</style></head><body><div class="row" id="row"></div>
<script>
// 每套：标题字体 / 正文字体 / 字号
const SETS = [
  { tag: 'A 融合像素（现用）', head: 'FP', body: 'FP', hs: 24, bs: 12, note: '对照：全部融合像素体。' },
  { tag: 'B 俐方体 11 号', head: 'CB', body: 'CB', hs: 22, bs: 11, note: '另一种像素字，笔画更方、更粗，有旧电子游戏感；繁简都有。' },
  { tag: 'C 毛笔招牌 + 像素', head: 'MS', body: 'FP', hs: 30, bs: 12, note: '标题、招牌用马善政毛笔楷书，像老铺手写招牌；正文像素字。港味最强。' },
  { tag: 'D 霞鹜文楷', head: 'WK', body: 'WK', hs: 24, bs: 14, note: '全部用文楷，温柔手写感，小字也清楚；不是像素字，画面会更“绘本”。' },
  { tag: 'E 小薇复古 + 文楷', head: 'XW', body: 'WK', hs: 26, bs: 14, note: '标题用站酷小薇（民国旧海报的瘦长字），正文文楷。文艺、怀旧。' },
  { tag: 'F 粗宋旧报 + 像素', head: 'SR', body: 'FP', hs: 26, bs: 12, note: '标题用思源宋体特粗，像旧报纸、旧价目表；正文像素字。' },
  { tag: 'G 手写菜单 + 像素', head: 'LC', body: 'FP', hs: 30, bs: 12, note: '标题用龙藏手写体，像粉笔小黑板；正文像素字。轻松随意。' },
  { tag: 'H 庆科黄油 + 像素', head: 'QK', body: 'FP', hs: 26, bs: 12, note: '上次的 B，放这里对照。' },
];
const row = document.getElementById('row');
for (const s of SETS) {
  const H = `font-family:${s.head};font-size:${s.hs}px;font-weight:${s.head==='SR'?900:400}`, B = `font-family:${s.body};font-size:${s.bs}px`;
  const d = document.createElement('div'); d.className = 'card';
  d.innerHTML = `<div class="tag">${s.tag}</div>
  <div class="bar" style="${B}"><span>● 1,240</span><span>春 · 1月3日</span><span>暂停</span></div>
  <div class="sign" style="${H}">街记冰室</div>
  <div class="menu" style="${B}"><b style="${H};font-size:${Math.round(s.hs * .7)}px">饼食 · 糖水</b>蛋挞<span>$8</span><br>菠萝包<span>$9</span><br>杨枝甘露<span>$22</span></div>
  <div class="bubble" style="${B}">排好长…下次再来</div>
  <div class="talk" style="${B}"><em style="${H};font-size:${Math.round(s.hs * .65)}px">雯姐</em><br>这个是茶袋，用来隔茶渣。</div>
  <div class="btns" style="${B}"><div>摆货</div><div>进货</div><div>员工</div><div>账本</div></div>
  <div class="note">${s.note}</div>`;
  row.append(d);
}
</script></body></html>
