个货架，能多摆几款。", "货架多咗，我要焗快啲喇。": "货架多了，我得烤快点了。", "账我计好咗，摆满就回本。": "账我算好了，摆满就回本。", "椰丝要炒香先落，咁先有层次。": "椰丝要先炒香再放，这样才有层次。", "以前我阿妈最钟意食。": "以前我妈最爱吃这个了~", "我兴趣班第一样学嘅都系佢。": "我兴趣班学的第一样也是它哦。", "冻冻地，啱晒夏天。": "冰冰凉凉的，夏天最适合啦！", "杨枝甘露，呢个一定好卖！": "杨枝甘露！这个一定好卖~", "鸡尾包，以前用卖剩嘅面包碎做馅，唔嘥嘢。": "鸡尾包嘛……以前是用卖剩的面包碎做馅，不浪费。", "高档餐厅唔会整呢啲。": "高档餐厅不会做这些的。", "咁我哋就整到最好食。": "那我们就做到最好吃吧！", "柠檬要压，唔好搅烂，先唔苦。": "柠檬要压，别捣烂，不然会苦哦。", "呢杯我饮得！": "这杯我能喝！", "马拉糕系蒸嘅，唔系焗嘅！我兴趣班考过。": "马拉糕是蒸的，不是烤的！我兴趣班考过哦~", "……佢啱。": "……嗯，她说得对。", "格仔要热透先倒浆，唔好心急。": "格子要热透再倒浆，别心急嘛。", "小沅读大学之后，饮咖啡多过饮奶茶。": "小沅上大学之后，喝咖啡比喝奶茶多了呀。", "咁呢杯系为佢整嘅？": "那这杯是为她做的吗？", "我喺旧饼房做咗几十年。": "我在旧饼房干了几十年。", "对面开咗间高档餐厅，连甜品都做埋，订单一张张冇咗。": "对面开了家高档餐厅，连甜品都一起做，订单一张张没了。", "执笠嗰日，我熨好条围裙先返去收拾。": "倒闭那天，我把围裙熨好才回去收拾。", "你问我识唔识新式嘢？唔识。": "你问我会不会新式的东西？不会。", "（配方簿掉出一张旧合照，旁边夹住一张你哋第一日出炉嘅相）": "（配方本里掉出一张旧合照，旁边夹着一张你们第一天出炉的照片）", "……放埋一齐，唔使问。": "……放一起吧，不用问。", "呢本簿，后面我留咗几页白纸。": "这本本子，后面我留了几页白纸。", "老味道唔一定要用旧办法卖。你写落去。": "老味道不一定要用老办法卖。你写下去。", "我会写好佢。": "我会写好的。", "储够钱就唔做咯，去上兴趣班。": "攒够钱就不干了，去上兴趣班。", "第一次为一炉包等成个下昼，我就知道系呢样。": "第一次为一炉面包等了一整个下午，我就知道是这个了。", "（端出一小盘）呢个……系试营业份量。": "（端出一小盘）这个……是试营业的分量。", "我哋要一百个。": "我们要一百个。", "你睇我以前啲会议便条，背面全部抄晒配方。": "你看我以前的会议便条，背面全抄满了配方。", "日历写到满一满，就系唔记得留时间俾自己。": "日历写得满满的，就是忘了给自己留时间。", "我唔做主管，做呢度最开心。": "我不当主管，在这儿干最开心。", "……你好，我系耀仔。惠姐係我姨妈。": "……你好，我是耀仔。惠姐是我姨妈。", "听讲你读过烘焙课？": "听说你上过烘焙课？", "读过基础班，喺大饼房做过备料同称重。": "上过基础班，在大饼房做过备料和称重那些。", "配方我识跟足，不过……未试过俾客人食自己做嘅嘢。": "配方我会照着做，不过……还没让客人吃过自己做的东西。", "称重准唔准？": "称重准不准？", "……嚟帮我焗多一盘。": "……来帮我多烤一盘。", "耀仔，你写咩呀？": "耀仔，你在写什么？", "坤伯今日开炉嘅温度。": "坤伯今天开炉的温度。", "写低冇用，要记喺手度。": "写下来没用，要记在手上。", "耀仔，今日啲挞皮好靓。": "耀仔，今天的挞皮很漂亮。", "（细声）佢转头又去练多一盘。": "（小声）他转头又去多练一盘了。", "阿澄话佢档口有可可试料，叫我拎啲返嚟试。": "阿澄说她摊位有可可试料，叫我拿点回来试试。", "你想做咩？": "你想做什么？", "奶茶味嘅泡芙……如果可以嘅话。": "奶茶味的泡芙……如果可以的话。", "做得出就摆出去，做唔出就再做。": "做得出来就摆出去，做不出来就再做。", "老板，今日有客人问边个做嘅包。": "老板，今天有客人问是谁做的面包。", "我话……我。": "我说……是我。", "老板！我系惠姐，雯姐同耀仔都系我屋企人。": "老板！我是惠姐，雯姐和耀仔都是我家里人哦！", "你上次主推杨枝甘露，我记得㗎！以后芒果平啲俾你。": "你上次主推杨枝甘露，我记得的！以后芒果算你便宜点~", "记得食饭呀，忙都要食。": "记得吃饭呀，再忙也要吃！", "……我系阿澄，茶同咖啡嘅供货。": "……我是阿澄，供应茶和咖啡。", "呢只茶叶焗五分钟，第三分钟最香。": "这款茶叶焖五分钟，第三分钟最香。", "你好熟喎。": "你好懂哦。", "以前想读甜品课程，后来接咗屋企档口。": "……以前想读甜品课程，后来接手了家里的摊位。", "耀仔成日讲你哋。有咩想试，我拎试料过嚟。": "耀仔常常说起你们。想试什么，我拿试料过来吧。", "隔篱终于打通喇！": "隔壁终于打通啦！", "地方大咗，炉都要快啲。": "地方大了，炉子也得快点嘛。", "老板，多咗卡座，我要跑多几步喇！": "老板，多了卡座，我得多跑几步了！", "大家辛苦，以后坐得落多啲街坊。": "大家辛苦啦，以后能坐下更多街坊了~", "姨妈！我放暑假喇，我嚟帮手！": "姨妈！我放暑假了，我来帮忙！", "呢个系我外甥女阿青，海棠中学中六。": "这是我外甥女阿青，海棠中学高三。", "我上年喺社团摆甜品摊，招牌我画㗎，好靓。": "我去年在社团摆甜品摊，招牌是我画的，很好看吧~", "靓就靓，收摊剩咗成枱。": "好看是好看，收摊剩了一整桌。", "水吧啱啱好要人，冰饮交俾你。": "水吧正好缺人，冰饮交给你。", "得！今日开始，听我讲——呃，我意思系，我会做好佢。": "好！从今天开始，听我说——呃，我是说，我会做好的！", "老板，蛋挞改名叫「日落能量圈」好唔好？": "老板，蛋挞改名叫「日落能量圈」好不好？", "……咁冻饮嗰边我可唔可以改？": "……那冷饮那边我能不能改？", "（练习册最后几页全部系包装草图）": "（练习册最后几页全是包装草图）", "画得几好喎，后面啲数字系咩？": "画得挺好嘛，后面那些数字是什么？", "成本……擦咗又计，计咗又擦。": "成本……擦了又算，算了又擦。", "我唔想人哋觉得我只系细路。": "我不想别人觉得我只是小孩。", "姨妈，荣叔今日又「算错份量」多带咗试料喎。": "姨妈，荣叔今天又「算错分量」多带了试料哦。", "佢一向粗心。": "他一向粗心。", "你连糖都计得准，佢点会次次算错？": "你连糖都算得准，他怎么会次次算错？", "……做嘢啦你。": "……干活吧你。", "靓之外，都要卖得晒。": "除了好看，还得卖得完。", "有冇剩？": "有剩吗？", "一个都冇！多谢你俾我试，老板。": "一个都没剩！谢谢你让我试，老板。", "（收银单睇咗两次）": "（收银单看了两遍）", "雯姐，你好认真喎。": "雯姐，你好认真啊。", "以前喺屋企管三餐冇人工收，今次有。": "以前在家管三餐没工资拿，这次有了。", "我个女小沅读紧大学，今日放学话嚟探我。": "我女儿小沅在读大学，今天说放学来看我。", "我叫佢照样排队，唔准打尖。": "我叫她照样排队，不准插队。", "原来雯姐上班真系唔得闲。": "原来雯姐上班真的很忙。", "离咗婚之后，我第一次写自己嘅更表。": "离婚之后，我第一次写自己的排班表。", "「听日我返早班，晚饭你搞掂。」我咁同小沅讲。": "「明天我上早班，晚饭你搞定。」我这么跟小沅说。", "佢点答？": "她怎么回？", "佢话：收到，老细。": "她说：收到，老板。", "新冻饮整好喇：鸳鸯冰，加少少椰奶。": "新冷饮做好了：鸳鸯冰，加一点椰奶。", "小沅试过，话好饮！": "小沅尝过，说好喝！", "街尾花店咏欣成日帮衬我哋。": "街尾花店的咏欣经常来光顾我们。", "……唔系因为我啦。": "……不是因为我啦。", "咁佢点解次次都问你返唔返工？": "那她为什么每次都问你上不上班？", "理发店阿珊拎住张旧戏飞嚟搵我……": "理发店的阿珊拿着张旧电影票来找我……", "咏欣又啱啱入嚟送花。": "咏欣又刚好进来送花。", "你自己谂清楚！": "你自己想清楚！", "（口袋跌出一叠便条：「星期六 睇戏」「星期日 饮茶」……）": "（口袋掉出一叠便条：「星期六 看电影」「星期日 喝早茶」……）", "我谂清楚喇，做人唔好乱应承。": "我想清楚了，做人别乱答应。", "我同阿珊、咏欣都讲清楚咗，日期时间写埋。": "我跟阿珊、咏欣都说清楚了，日期时间都写上。", "原来你识讲完整日期。": "原来你会说完整的日期。", "老板，多谢你俾我机会！": "老板，谢谢你给我机会！", "咦，仲未执笠？": "咦，还没倒闭啊？", "你爸咁讲笑，佢成晚话想嚟睇。": "你爸开玩笑的啦，他一晚上都在说想来看看。", "我计过，呢箱蛋挞三日卖得晒。": "我算过了，这箱蛋挞三天就能卖完。", "（临走偷偷塞咗个利是）": "（临走偷偷塞了个红包）", "爸，你又计数……多谢你哋嚟。": "爸，你又算账……谢谢你们来~", "老板，你知唔知点解铺头叫「街记」？": "老板，你知不知道为什么店叫「街记」？" function morningSpecials() {
  const quiet = f => { const d = SFX.deny, b = SFX.buy; SFX.deny = SFX.buy = () => {}; try { f(); } finally { SFX.deny = d; SFX.buy = b; } };
  if (hasSk('kun_plan') && W.history.length) {   // yesterday's two best sellers become today's leads
    const sold = W.history[W.history.length - 1].sold || {}, top = PIDS.filter(p => unlocked(p) && sold[p]).sort((a, b) => sold[b] - sold[a]).slice(0, 2);

  }
  if (hasSk('yao_rd')) { const L_ = researchable(); if (L_.length && canResearch()) { const p = L_[0]; W.known[p] = true; W.rdDay = W.day; applyDecor(); notice('耀仔研发好了「' + PRODUCTS[p].name + '」'); } }

    const shown = new Set(); for (const id of SHELF_IDS) for (const L_ of W.shelves[id].layers) if (L_.p) shown.add(L_.p);
    const want = PIDS.filter(p => unlocked(p) && W.plan[p] !== 'off' && !shown.has(p)).sort((a, b) => (W.plan[b] === 'pri') - (W.plan[a] === 'pri') || wantOf(b) - wantOf(a)); let n = 0;
    for (const id of SHELF_IDS) { const st = W.shelves[id]; if (st.locked) continue; st.layers.forEach((L_, li) => { if (L_.p) return; const i = want.findIndex(p => (PRODUCTS[p].where === 'fridge') === !!st.fridge); if (i < 0) return; if (assignLayer(id, li, want[i])) { want.splice(i, 1); n++; } }); }
    if (n) notice('阿青摆好了 ' + n + ' 层货架');

  const m0 = W.money, d = SFX.deny, b = SFX.buy; SFX.deny = SFX.buy = () => {}; try { restock(3); } finally { SFX.deny = d; SFX.buy = b; }
  if (m0 > W.money) notice('莲姨自动进货 -' + money$(m0 - W.money));

function buySpecial(k) {   // unlock with ★ (Lv4+); later taps switch it on / off

  W.pts -= cost; W.sk[id] = true; SFX.ding(); notice((NAMES[k] || k) + '学会了「' + name + '」'); saveGame(); return true;
}
